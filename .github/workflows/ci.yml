name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax check
        run: |
          python -m py_compile server.py dossier.py events.py transcripts.py auth.py voice_memory.py honcho_voice.py backends/*.py
      - name: JS syntax check
        run: node --check web/app.js
