<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0d1117"/>

  <!-- LEFT: title block, vertically centered to the conversation -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="290" font-weight="800" font-size="104" fill="#f0f6fc" letter-spacing="-3">Hermano</text>
    <text x="80" y="340" font-weight="500" font-size="24" fill="#8b949e">A voice line to your own agent.</text>
    <text x="80" y="372" font-weight="500" font-size="24" fill="#8b949e">Grounded in today's context.</text>
  </g>

  <!-- RIGHT: a single exchange. Both bubbles share right edge at x=1200 and left edge at x=680 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- user bubble -->
    <g transform="translate(680, 200)">
      <rect width="520" height="72" rx="18" fill="#1f6feb"/>
      <text x="24" y="30" font-size="14" fill="#bfdbfe" font-weight="600" letter-spacing="1">YOU</text>
      <text x="24" y="58" font-size="22" fill="#ffffff">Where did we land on the Acme proposal?</text>
    </g>
    <!-- assistant bubble -->
    <g transform="translate(680, 296)">
      <rect width="520" height="144" rx="18" fill="#161b22" stroke="#30363d"/>
      <text x="24" y="30" font-size="14" fill="#7ee787" font-weight="600" letter-spacing="1">HERMANO</text>
      <text x="24" y="62" font-size="22" fill="#c9d1d9">Parked Tuesday pending their</text>
      <text x="24" y="90" font-size="22" fill="#c9d1d9">security review. Follow-up on</text>
      <text x="24" y="118" font-size="22" fill="#c9d1d9">your calendar Thursday 2pm.</text>
    </g>
  </g>
</svg>
