<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg3)"/>

  <!-- Left: title block -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="104" fill="#f0f6fc" letter-spacing="-3">Hermano</text>
  <text x="80" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="26" fill="#8b949e">Voice that already knows what you're working on.</text>

  <!-- Bottom features -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(80, 470)">
      <circle cx="16" cy="16" r="6" fill="#7ee787"/>
      <text x="38" y="22" font-size="20" fill="#c9d1d9">Today's dossier baked into every session</text>
    </g>
    <g transform="translate(80, 510)">
      <circle cx="16" cy="16" r="6" fill="#58a6ff"/>
      <text x="38" y="22" font-size="20" fill="#c9d1d9">Narrow tools for calendar, email, notes, journal</text>
    </g>
    <g transform="translate(80, 550)">
      <circle cx="16" cy="16" r="6" fill="#d2a8ff"/>
      <text x="38" y="22" font-size="20" fill="#c9d1d9">One slow `deep_research` path for the hard stuff</text>
    </g>
  </g>

  <!-- Right: chat bubbles -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- user -->
    <g transform="translate(720, 80)">
      <rect width="480" height="76" rx="18" fill="#1f6feb"/>
      <text x="24" y="32" font-size="18" fill="#dbeafe" font-weight="600">you</text>
      <text x="24" y="60" font-size="20" fill="#ffffff">Where did we land on the Acme proposal?</text>
    </g>
    <!-- assistant -->
    <g transform="translate(640, 180)">
      <rect width="560" height="120" rx="18" fill="#161b22" stroke="#30363d"/>
      <text x="24" y="32" font-size="18" fill="#7ee787" font-weight="600">hermano</text>
      <text x="24" y="62" font-size="20" fill="#c9d1d9">Loop ol_42 — you parked it Tuesday pending</text>
      <text x="24" y="88" font-size="20" fill="#c9d1d9">their security review. No reply yet; Calendar</text>
      <text x="24" y="114" font-size="20" fill="#c9d1d9">shows a follow-up Thursday 2pm.</text>
    </g>
    <!-- tool chip -->
    <g transform="translate(720, 325)">
      <rect width="280" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
      <circle cx="22" cy="20" r="5" fill="#ffa657">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">looking up open loop…</text>
    </g>
    <!-- user 2 -->
    <g transform="translate(720, 390)">
      <rect width="480" height="76" rx="18" fill="#1f6feb"/>
      <text x="24" y="32" font-size="18" fill="#dbeafe" font-weight="600">you</text>
      <text x="24" y="60" font-size="20" fill="#ffffff">Draft a nudge — friendly, two sentences.</text>
    </g>
  </g>
</svg>
