<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#fafafa"/>

  <!-- Big H mark -->
  <g transform="translate(880, 180)">
    <circle cx="140" cy="140" r="140" fill="#0d1117"/>
    <text x="140" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="220" fill="#fafafa" letter-spacing="-6">H</text>
    <!-- "voice on" indicator -->
    <circle cx="248" cy="48" r="14" fill="#22c55e"/>
    <circle cx="248" cy="48" r="22" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="128" fill="#0d1117" letter-spacing="-4">Hermano</text>

  <!-- Tagline -->
  <text x="80" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="30" fill="#57606a">A live voice line to your own agent —</text>
  <text x="80" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="30" fill="#57606a">grounded in today's context from second 1.</text>

  <!-- Pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <g transform="translate(80, 470)">
      <rect width="190" height="46" rx="23" fill="#0d1117"/>
      <text x="95" y="30" text-anchor="middle" fill="#7ee787">OpenAI Realtime</text>
    </g>
    <g transform="translate(286, 470)">
      <rect width="130" height="46" rx="23" fill="#0d1117"/>
      <text x="65" y="30" text-anchor="middle" fill="#58a6ff">WebRTC</text>
    </g>
    <g transform="translate(432, 470)">
      <rect width="170" height="46" rx="23" fill="#0d1117"/>
      <text x="85" y="30" text-anchor="middle" fill="#d2a8ff">local sidecar</text>
    </g>
    <g transform="translate(618, 470)">
      <rect width="200" height="46" rx="23" fill="#0d1117"/>
      <text x="100" y="30" text-anchor="middle" fill="#ffa657">your context</text>
    </g>
  </g>

  <!-- footer -->
  <text x="80" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#0d1117">github.com/brklyngg/hermano</text>
</svg>
