<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Sky / background -->
  <rect width="1280" height="640" fill="#fde8d4"/>
  <!-- Sand -->
  <rect y="470" width="1280" height="170" fill="#f4d29a"/>
  <!-- Sand speckles -->
  <g fill="#d9a86a" opacity="0.6">
    <circle cx="120" cy="520" r="3"/>
    <circle cx="240" cy="560" r="2"/>
    <circle cx="360" cy="540" r="3"/>
    <circle cx="500" cy="580" r="2"/>
    <circle cx="700" cy="530" r="3"/>
    <circle cx="860" cy="570" r="2"/>
    <circle cx="1000" cy="540" r="3"/>
    <circle cx="1140" cy="580" r="2"/>
    <circle cx="180" cy="600" r="2"/>
    <circle cx="800" cy="610" r="3"/>
  </g>

  <!-- Sun -->
  <circle cx="1100" cy="130" r="60" fill="#ffd66b"/>
  <circle cx="1100" cy="130" r="80" fill="#ffd66b" opacity="0.25"/>

  <!-- Cloud -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="220" cy="140" rx="60" ry="22"/>
    <ellipse cx="260" cy="125" rx="42" ry="22"/>
    <ellipse cx="180" cy="130" rx="34" ry="18"/>
  </g>

  <!-- LEFT CRAB -->
  <g transform="translate(440, 380)">
    <!-- shadow -->
    <ellipse cx="0" cy="105" rx="110" ry="10" fill="#000" opacity="0.12"/>
    <!-- body -->
    <ellipse cx="0" cy="50" rx="110" ry="70" fill="#ff6b6b"/>
    <!-- belly -->
    <ellipse cx="0" cy="68" rx="78" ry="40" fill="#ff8a8a"/>
    <!-- eye stalks -->
    <line x1="-30" y1="-15" x2="-38" y2="-55" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="-15" x2="38" y2="-55" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-38" cy="-60" r="14" fill="#fff"/>
    <circle cx="38" cy="-60" r="14" fill="#fff"/>
    <circle cx="-36" cy="-58" r="6" fill="#1a1a1a"/>
    <circle cx="40" cy="-58" r="6" fill="#1a1a1a"/>
    <circle cx="-34" cy="-60" r="2" fill="#fff"/>
    <circle cx="42" cy="-60" r="2" fill="#fff"/>

    <!-- blush -->
    <circle cx="-55" cy="55" r="10" fill="#ff4d6d" opacity="0.5"/>
    <circle cx="55" cy="55" r="10" fill="#ff4d6d" opacity="0.5"/>

    <!-- smile -->
    <path d="M -20 50 Q 0 70 20 50" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- left claw (outside) -->
    <line x1="-100" y1="40" x2="-160" y2="20" stroke="#ff6b6b" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(-180, 10) rotate(-20)">
      <ellipse cx="0" cy="0" rx="28" ry="20" fill="#ff6b6b"/>
      <path d="M -20 -8 Q 10 -22 26 -4 Q 10 4 -16 0 Z" fill="#ff8a8a"/>
      <path d="M -20 8 Q 10 22 26 4" stroke="#ff6b6b" stroke-width="4" fill="none"/>
    </g>

    <!-- legs left side -->
    <path d="M -90 70 Q -120 80 -130 100" stroke="#ff6b6b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M -85 90 Q -110 105 -115 120" stroke="#ff6b6b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M -75 105 Q -90 120 -88 135" stroke="#ff6b6b" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- legs bottom right (toward partner) -->
    <path d="M 75 105 Q 92 120 88 135" stroke="#ff6b6b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 85 90 Q 105 100 110 115" stroke="#ff6b6b" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- holding-hand claw (right, reaching to partner) -->
    <line x1="100" y1="40" x2="155" y2="30" stroke="#ff6b6b" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(170, 28) rotate(15)">
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="#ff6b6b"/>
      <path d="M -18 -6 Q 8 -18 22 -2 Q 8 4 -14 0 Z" fill="#ff8a8a"/>
    </g>
  </g>

  <!-- RIGHT CRAB -->
  <g transform="translate(840, 380)">
    <ellipse cx="0" cy="105" rx="110" ry="10" fill="#000" opacity="0.12"/>
    <ellipse cx="0" cy="50" rx="110" ry="70" fill="#f49ac1"/>
    <ellipse cx="0" cy="68" rx="78" ry="40" fill="#ffb8d6"/>
    <line x1="-30" y1="-15" x2="-38" y2="-55" stroke="#f49ac1" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="-15" x2="38" y2="-55" stroke="#f49ac1" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-38" cy="-60" r="14" fill="#fff"/>
    <circle cx="38" cy="-60" r="14" fill="#fff"/>
    <circle cx="-40" cy="-58" r="6" fill="#1a1a1a"/>
    <circle cx="36" cy="-58" r="6" fill="#1a1a1a"/>
    <circle cx="-38" cy="-60" r="2" fill="#fff"/>
    <circle cx="38" cy="-60" r="2" fill="#fff"/>

    <circle cx="-55" cy="55" r="10" fill="#ff4d6d" opacity="0.45"/>
    <circle cx="55" cy="55" r="10" fill="#ff4d6d" opacity="0.45"/>

    <path d="M -20 50 Q 0 70 20 50" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- right claw (outside) -->
    <line x1="100" y1="40" x2="160" y2="20" stroke="#f49ac1" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(180, 10) rotate(20)">
      <ellipse cx="0" cy="0" rx="28" ry="20" fill="#f49ac1"/>
      <path d="M -20 -8 Q 10 -22 26 -4 Q 10 4 -16 0 Z" fill="#ffb8d6"/>
      <path d="M -20 8 Q 10 22 26 4" stroke="#f49ac1" stroke-width="4" fill="none"/>
    </g>

    <!-- legs right side -->
    <path d="M 90 70 Q 120 80 130 100" stroke="#f49ac1" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 85 90 Q 110 105 115 120" stroke="#f49ac1" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 75 105 Q 90 120 88 135" stroke="#f49ac1" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- legs bottom left -->
    <path d="M -75 105 Q -92 120 -88 135" stroke="#f49ac1" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M -85 90 Q -105 100 -110 115" stroke="#f49ac1" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- holding-hand claw (left, reaching to partner) -->
    <line x1="-100" y1="40" x2="-155" y2="30" stroke="#f49ac1" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(-170, 28) rotate(-15)">
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="#f49ac1"/>
      <path d="M -18 -6 Q 8 -18 22 -2 Q 8 4 -14 0 Z" fill="#ffb8d6"/>
    </g>
  </g>

  <!-- little heart between them -->
  <g transform="translate(640, 330)">
    <path d="M 0 8 C -14 -10 -32 2 -16 18 L 0 32 L 16 18 C 32 2 14 -10 0 8 Z" fill="#ff4d6d"/>
    <path d="M 0 8 C -14 -10 -32 2 -16 18 L 0 32 L 16 18 C 32 2 14 -10 0 8 Z" fill="none" stroke="#a01632" stroke-width="2"/>
  </g>

  <!-- tiny shells -->
  <g>
    <path d="M 140 555 Q 155 540 170 555 L 165 568 L 155 562 L 145 568 Z" fill="#ffb39c" stroke="#c97a64" stroke-width="2"/>
    <path d="M 1080 545 Q 1095 530 1110 545 L 1105 558 L 1095 552 L 1085 558 Z" fill="#ffb39c" stroke="#c97a64" stroke-width="2"/>
  </g>
</svg>
