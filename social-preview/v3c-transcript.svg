<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0d1117"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- wordmark, top-left, large -->
    <text x="80" y="180" font-weight="800" font-size="96" fill="#f0f6fc" letter-spacing="-3">Hermano</text>
    <text x="80" y="222" font-weight="500" font-size="22" fill="#8b949e">A voice line to your own agent — grounded from second 1.</text>
  </g>

  <!-- transcript-style block, monospace, single column -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">
    <g transform="translate(80, 320)">
      <text x="0" y="0" fill="#6e7681">you</text>
      <text x="80" y="0" fill="#f0f6fc">Where did we land on Acme?</text>
    </g>
    <g transform="translate(80, 380)">
      <text x="0" y="0" fill="#7ee787">hermano</text>
      <text x="140" y="0" fill="#f0f6fc">Parked Tuesday. Follow-up</text>
      <text x="140" y="32" fill="#f0f6fc">Thursday 2pm.</text>
    </g>
    <g transform="translate(80, 484)">
      <text x="0" y="0" fill="#6e7681">you</text>
      <text x="80" y="0" fill="#f0f6fc">Draft a nudge.</text>
    </g>
  </g>

  <!-- subtle cursor -->
  <rect x="290" y="466" width="14" height="24" fill="#7ee787">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
